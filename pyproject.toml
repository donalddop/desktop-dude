[project]
name = "desktop-dude"
version = "0.1.0"
description = "A stick figure that lives on your desktop and fights your cursor"
requires-python = ">=3.11"
dependencies = [
    "comtypes>=1.4 ; sys_platform == 'win32'",
    "pycaw>=20240210 ; sys_platform == 'win32'",
    "pyside6-essentials>=6.6",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
