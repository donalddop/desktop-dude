[project]
name = "desktop-dude"
version = "0.1.0"
description = "A stick figure that lives on your desktop and fights your cursor"
requires-python = ">=3.11"
dependencies = [
    "comtypes>=1.4 ; sys_platform == 'win32'",
    "faster-whisper>=1.2.1 ; sys_platform == 'win32'",
    "numpy>=2.4.6",
    "pyobjc-framework-applicationservices>=11 ; sys_platform == 'darwin'",
    "pyobjc-framework-cocoa>=11 ; sys_platform == 'darwin'",
    "pyobjc-framework-quartz>=11 ; sys_platform == 'darwin'",
    "pycaw>=20240210 ; sys_platform == 'win32'",
    "pyside6-essentials>=6.6",
    "soundcard>=0.4.3 ; sys_platform == 'win32'",
    "truststore>=0.10",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
